<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Checklist Mover Power-Up Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    var BASE_URL = 'https://checklistmoverfrontend.vercel.app';
    var ICON_URL = BASE_URL + '/powerup-icon.svg';

    window.TrelloPowerUp.initialize({
      'card-buttons': function(t, options) {
        return [{
          icon: ICON_URL,
          text: 'Checklist Mover',
          callback: function(t) {
            return t.modal({
              url: BASE_URL + '/index.html?trello=1',
              title: 'Checklist Mover',
              height: 620,
              fullscreen: false
            });
          }
        }];
      },
      'board-buttons': function(t, options) {
        return [{
          icon: ICON_URL,
          text: 'Checklist Mover',
          callback: function(t) {
            return t.modal({
              url: BASE_URL + '/index.html?trello=1',
              title: 'Checklist Mover',
              height: 620,
              fullscreen: false
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
