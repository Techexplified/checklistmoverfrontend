<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Checklist Mover Power-Up Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    var ICON_URL = window.location.origin + '/powerup-icon.svg';

    window.TrelloPowerUp.initialize({
      'card-buttons': function(t, options) {
        return [{
          icon: ICON_URL,
          text: 'Checklist Mover',
          callback: function(t) {
            return t.modal({
              url: './index.html?trello=1',
              title: 'Checklist Mover',
              height: 600,
              fullscreen: false,
              actions: [{
                icon: ICON_URL,
                alt: 'Checklist Mover',
                position: 'left'
              }]
            });
          }
        }];
      },
      'card-badges': function(t, options) {
        return t.card('checklists')
          .then(function(card) {
            return [];
          });
      }
    });
  </script>
</body>
</html>
